spring.application.name=enterprise-system

# Server Configuration
server.port=8080

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/erp_database?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=karthiSQL@25
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.erp=DEBUG

# JSON Configuration
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# JWT Configuration
# In production, use environment variables and set erp.dev.mode=false
erp.app.jwtExpirationMs=86400000

# CORS: comma-separated allowed origins (e.g. https://yourerp.com for production)
erp.app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# Cookie secure flag: set true in production (HTTPS) so browser only sends cookie over HTTPS
erp.app.cookie.secure=false

# Development Mode - enables default passwords and JWT secret
# SET TO FALSE IN PRODUCTION!
erp.dev.mode=true

# Production settings (use with spring.profiles.active=prod or env):
# erp.app.jwtSecret=${JWT_SECRET}
# erp.admin.password=${ADMIN_PASSWORD}
# erp.app.cors.allowed-origins=https://yourerp.com
# erp.app.cookie.secure=true


# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.activated=true

# Show request duration in Swagger UI
springdoc.swagger-ui.displayRequestDuration=true

# Package to scan for API
springdoc.packages-to-scan=com.erp.enterprise.controller

# Custom Swagger UI settings
springdoc.swagger-ui.defaultModelsExpandDepth=1
springdoc.swagger-ui.defaultModelExpandDepth=1
springdoc.swagger-ui.docExpansion=none