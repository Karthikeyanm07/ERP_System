# Production profile - activate with: spring.profiles.active=prod
# Required: set JWT_SECRET, ADMIN_PASSWORD (and DB credentials) via environment variables

# Disable dev mode - JWT secret and admin password MUST come from env
erp.dev.mode=false

# Cookie must be Secure when using HTTPS
erp.app.cookie.secure=true

# CORS: set CORS_ALLOWED_ORIGINS env (comma-separated) or override below
erp.app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://yourerp.com}

# Reduce logging in production
logging.level.root=INFO
logging.level.com.erp=INFO
logging.level.org.hibernate.SQL=WARN
spring.jpa.show-sql=false
